<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#CE1126">
    <title>Red Hat Pizzeria</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #111827;
            --panel: #1F2937;
            --primary: #CE1126;
            --primary-hover: #b90f22;
            --user-msg: #374151;
            --text-main: #F3F4F6;
            --text-muted: #9CA3AF;
            --border: #374151;
            --error: #EF4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            height: 100vh;
            /* Fallback for older browsers */
            height: 100dvh;
            /* Accounts for mobile browser toolbars */
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: rgba(31, 41, 55, 0.8);
            backdrop-filter: blur(10px);
            padding: calc(16px + env(safe-area-inset-top)) 16px 16px 16px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .header h1 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .header .status {
            width: 8px;
            height: 8px;
            background: #10B981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10B981;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.5;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            word-wrap: break-word;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.assistant {
            background: var(--primary);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.user {
            background: var(--user-msg);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.error {
            background: var(--error);
            align-self: center;
            max-width: 95%;
            font-size: 0.85rem;
        }

        .message.assistant p {
            margin-bottom: 0.5em;
        }

        .message.assistant p:last-child {
            margin-bottom: 0;
        }

        .input-area {
            background: var(--panel);
            padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--border);
        }

        .input-wrapper {
            display: flex;
            gap: 8px;
            background: rgba(17, 24, 39, 0.5);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 4px 4px 4px 16px;
            transition: border-color 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary);
        }

        .input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            font-family: inherit;
        }

        .input-wrapper input::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .send-btn:hover {
            background: var(--primary-hover);
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .send-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            transform: translateX(1px);
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 4px 8px;
            align-items: center;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="status"></div>
        <h1>Red Hat Pizzeria</h1>
    </div>

    <div class="chat-container" id="chat">
        <div class="message assistant">
            Welcome to Red Hat Pizzeria! 🍕 How can I help you today?
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="message" placeholder="Message assistant..." autocomplete="off">
            <button class="send-btn" id="send" onclick="sendMessage()">
                <svg viewBox="0 0 24 24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                </svg>
            </button>
        </div>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('message');
        const sendBtn = document.getElementById('send');
        let isStreaming = false;

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function createMessage(type) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            chat.appendChild(div);
            scrollToBottom();
            return div;
        }

        function scrollToBottom() {
            chat.scrollTop = chat.scrollHeight;
        }

        async function sendMessage() {
            const message = input.value.trim();
            if (!message || isStreaming) return;

            input.value = '';
            isStreaming = true;
            sendBtn.disabled = true;

            const userDiv = createMessage('user');
            userDiv.textContent = message;

            const assistantDiv = createMessage('assistant');
            assistantDiv.innerHTML = '<div class="typing-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                if (!response.ok) throw new Error('Network error');

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullContent = '';
                let hasStarted = false;
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (trimmed.startsWith('data: ')) {
                            const dataStr = trimmed.slice(6).trim();
                            if (dataStr === '[DONE]') continue;
                            try {
                                const data = JSON.parse(dataStr);
                                if (data.type === 'chunk') {
                                    if (!hasStarted) {
                                        assistantDiv.innerHTML = '';
                                        hasStarted = true;
                                    }
                                    fullContent += data.content;
                                    assistantDiv.innerHTML = typeof marked !== 'undefined' ? marked.parse(fullContent) : fullContent;
                                    scrollToBottom();
                                } else if (data.type === 'error') {
                                    if (!hasStarted) assistantDiv.innerHTML = '';
                                    assistantDiv.className = 'message error';
                                    assistantDiv.textContent = data.message;
                                    scrollToBottom();
                                }
                            } catch (e) { }
                        }
                    }
                }
            } catch (e) {
                assistantDiv.className = 'message error';
                assistantDiv.textContent = 'Connection failed. Please try again.';
            } finally {
                isStreaming = false;
                sendBtn.disabled = false;
                input.focus();
                scrollToBottom();
            }
        }
    </script>
</body>

</html>
